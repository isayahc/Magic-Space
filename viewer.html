<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OpenIndustries — LLM scene comparison</title>
<style>
body{margin:0;background:#192322;color:#e4eddf;font:15px system-ui}header{position:absolute;z-index:1;top:16px;left:16px;right:16px;padding:18px;background:#101917ed;border:1px solid #405044;border-radius:12px;max-width:650px}h1{font-size:20px;margin:0 0 12px}select,button{font:inherit;padding:8px;background:#c6ee86;border:0;border-radius:6px;color:#152218;margin-right:8px}p{margin:10px 0 0;color:#bdc9b8}canvas{display:block}input{width:220px;vertical-align:middle}#status{font-variant-numeric:tabular-nums}a{color:#c6ee86}
</style></head><body>
<header><h1>Model-generated robotic farm · OpenIndustries</h1>
<select id="model" aria-label="Model"><option value="qwen3-4b">Qwen3 4B · Open weight</option><option value="gpt-4.1">GPT-4.1 · Closed source</option></select><button id="play">Pause</button>
<p><input id="time" aria-label="Animation time" type="range" min="0" max="20" step="0.01" value="0"> <span id="status">Loading…</span></p>
<p>Drag to orbit · Scroll to zoom · Right-drag to pan</p>
<p>Four workbenches represent grow beds. Existing robot geometry follows each model’s unedited 20-second route.</p>
<p><a id="download" download="qwen3-4b.scene.json" href="/comparison/qwen3-4b.json">Download editable scene</a></p></header>
<script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import { OrbitControls } from '/node_modules/three/examples/jsm/controls/OrbitControls.js';
import { createWorld, applyWorldPoses } from '/src/lib/world.ts';
import { readManifest, hydrateManifest, evaluateWorkspace } from '/src/lib/workspace.ts';
const model = document.querySelector('#model'), play = document.querySelector('#play'), slider = document.querySelector('#time'), status = document.querySelector('#status');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2)); document.body.append(renderer.domElement);
const camera = new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,200);
camera.position.set(14,13,17);
const controls = new OrbitControls(camera,renderer.domElement); controls.target.set(0,0,0); controls.enableDamping=true;
let state,world,time=0,playing=true,last=performance.now();
async function load(){
  status.textContent='Loading…';
  const response=await fetch(`/comparison/${model.value}.json`);
  if(!response.ok)throw new Error(`Scene load failed: ${response.status}`);
  state=hydrateManifest(readManifest(await response.json()),[]);
  world?.dispose(); world=createWorld(state.items.map(i=>i.asset),state.room);
  time=0;
  const a=document.querySelector('#download');a.href=`/comparison/${model.value}.json`;a.download=`${model.value}.scene.json`;
  document.body.dataset.ready=model.value;
}
model.onchange=()=>load().catch(e=>status.textContent=e.message);
play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};
slider.oninput=()=>{time=Number(slider.value);playing=false;play.textContent='Play'};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
await load();
renderer.setAnimationLoop(now=>{
  const dt=Math.min((now-last)/1000,.1);last=now;
  if(playing)time=(time+dt)%20;
  if(world){applyWorldPoses(world.groups,evaluateWorkspace(state.items,state.animation,time));controls.update();renderer.render(world.scene,camera);slider.value=time;status.textContent=`${time.toFixed(1)} / 20 s`;}
});
</script></body></html>
