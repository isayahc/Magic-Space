name: Cross-platform smoke checks
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node scripts/smoke.mjs --offline
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        run: bash -n scripts/setup.sh
      - name: Check PowerShell installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/setup.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
      - name: Install OpenCode and local Comfy MCP (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash scripts/setup.sh --mode local
      - name: Install OpenCode and local Comfy MCP (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/setup.ps1 -Mode local
      - name: Verify local MCP handshake through OpenCode
        run: node scripts/smoke.mjs --mode local
